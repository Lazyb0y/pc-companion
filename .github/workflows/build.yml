name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.configuration }}, ${{ matrix.platform }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore PCCompanion.slnx --locked-mode -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build PCCompanion.slnx --no-restore -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      - name: Test
        run: dotnet test --solution PCCompanion.slnx --no-build -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

  installer:
    name: Installer (${{ matrix.platform }})
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Build installer
        run: dotnet build src/PCCompanion.Installer/PCCompanion.Installer.wixproj -c Release -p:Platform=${{ matrix.platform }} -p:RestoreLockedMode=true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PCCompanion-${{ matrix.platform }}-msi
          path: src/PCCompanion.Installer/bin/${{ matrix.platform }}/Release/PCCompanion-${{ matrix.platform }}.msi
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
