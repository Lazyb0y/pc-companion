version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # WiX stays on version 5; see docs/development/packaging.md.
    ignore:
      - dependency-name: "WixToolset.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    # CodeQL's steps must all use one version, so they update in one pull request.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
