<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <defs>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5A86FF"/>
            <stop offset="1" stop-color="#3940D6"/>
        </linearGradient>
        <linearGradient id="highlight" x1="0" y1="0" x2=".6" y2=".6">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFD25E"/>
            <stop offset="1" stop-color="#FF8A3C"/>
        </linearGradient>
        <linearGradient id="overlap" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFF6E6"/>
            <stop offset="1" stop-color="#FFD9B0"/>
        </linearGradient>
        <clipPath id="blue">
            <rect x="2" y="11" width="27" height="27" rx="7.5"/>
        </clipPath>
    </defs>
    <rect x="2" y="11" width="27" height="27" rx="7.5" fill="url(#frame)"/>
    <rect x="2" y="11" width="27" height="27" rx="7.5" fill="url(#highlight)"/>
    <rect x="18.5" y="3" width="18.5" height="18.5" rx="5.5" fill="url(#accent)" transform="rotate(10 27.75 12.25)"/>
    <g clip-path="url(#blue)">
        <rect x="18.5" y="3" width="18.5" height="18.5" rx="5.5" fill="url(#overlap)" transform="rotate(10 27.75 12.25)"/>
    </g>
</svg>
