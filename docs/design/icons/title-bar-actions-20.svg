        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFD25E"/>
            <stop offset="1" stop-color="#FF8A3C"/>
        </linearGradient>
    </defs>
    <rect x="5" y="1" width="10" height="18" rx="5" fill="url(#frame)"/>
    <rect x="5" y="1" width="10" height="18" rx="5" fill="url(#highlight)"/>
    <rect x="6.5" y="2.5" width="7" height="15" rx="3.5" fill="url(#glass)"/>
    <rect x="6.5" y="9.5" width="7" height="1" rx="0" fill="url(#frame)"/>
    <rect x="9" y="4" width="2" height="4" rx="1" fill="url(#accent)"/>
