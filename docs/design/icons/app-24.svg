<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
    <defs>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5A86FF"/>
            <stop offset="1" stop-color="#3940D6"/>
        </linearGradient>
        <linearGradient id="highlight" x1="0" y1="0" x2=".6" y2=".6">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFD25E"/>
            <stop offset="1" stop-color="#FF8A3C"/>
        </linearGradient>
        <linearGradient id="overlap" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFF6E6"/>
            <stop offset="1" stop-color="#FFD9B0"/>
        </linearGradient>
        <clipPath id="blue">
            <rect x="1" y="7" width="16" height="16" rx="4.5"/>
        </clipPath>
    </defs>
    <rect x="1" y="7" width="16" height="16" rx="4.5" fill="url(#frame)"/>
    <rect x="1" y="7" width="16" height="16" rx="4.5" fill="url(#highlight)"/>
    <rect x="11" y="2" width="11" height="11" rx="3.25" fill="url(#accent)" transform="rotate(10 16.5 7.5)"/>
    <g clip-path="url(#blue)">
        <rect x="11" y="2" width="11" height="11" rx="3.25" fill="url(#overlap)" transform="rotate(10 16.5 7.5)"/>
    </g>
</svg>
