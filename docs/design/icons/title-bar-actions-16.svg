<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
    <defs>
        <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5A86FF"/>
            <stop offset="1" stop-color="#3940D6"/>
        </linearGradient>
        <linearGradient id="highlight" x1="0" y1="0" x2=".6" y2=".6">
            <stop offset="0" stop-color="#FFFFFF" stop-opacity=".28"/>
            <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#F3F7FF"/>
            <stop offset="1" stop-color="#CBD9FF"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FFD25E"/>
            <stop offset="1" stop-color="#FF8A3C"/>
        </linearGradient>
    </defs>
    <rect x="4" y="1" width="8" height="14" rx="4" fill="url(#frame)"/>
    <rect x="4" y="1" width="8" height="14" rx="4" fill="url(#highlight)"/>
    <rect x="5" y="2" width="6" height="12" rx="3" fill="url(#glass)"/>
    <rect x="5" y="7.5" width="6" height="1" rx="0" fill="url(#frame)"/>
    <rect x="7" y="3" width="2" height="3.5" rx="1" fill="url(#accent)"/>
